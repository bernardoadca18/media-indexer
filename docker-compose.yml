x-neovids-logging: &neovids-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: "no"
    logging: *neovids-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-media_indexer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-media_indexer}
      POSTGRES_DB: ${POSTGRES_DB:-media_indexer}
    ports: ["5435:5432"]
    volumes: [media-indexer-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-media_indexer} -d ${POSTGRES_DB:-media_indexer}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: "no"
    init: true
    stop_grace_period: 5m
    logging: *neovids-logging
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://media_indexer:media_indexer@db:5432/media_indexer}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/storage}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      JOB_STALE_TIMEOUT_SECONDS: ${JOB_STALE_TIMEOUT_SECONDS:-300}
      JOB_HEARTBEAT_INTERVAL_SECONDS: ${JOB_HEARTBEAT_INTERVAL_SECONDS:-30}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      TRANSCRIPTION_BATCH_SIZE: ${TRANSCRIPTION_BATCH_SIZE:-25}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-auto}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      WHISPER_VAD_FILTER: ${WHISPER_VAD_FILTER:-true}
      WHISPER_WORD_TIMESTAMPS: ${WHISPER_WORD_TIMESTAMPS:-true}
      HF_HOME: /data/models/huggingface
      FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
      FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
      VISUAL_INDEX_BATCH_SIZE: ${VISUAL_INDEX_BATCH_SIZE:-25}
      SCENE_DETECTION_ENABLED: ${SCENE_DETECTION_ENABLED:-true}
      SCENE_DETECTOR: ${SCENE_DETECTOR:-ffmpeg_scdet}
      SCENE_THRESHOLD: ${SCENE_THRESHOLD:-10.0}
      REPRESENTATIVE_FRAME_INTERVAL_SECONDS: ${REPRESENTATIVE_FRAME_INTERVAL_SECONDS:-10.0}
      REPRESENTATIVE_FRAME_WIDTH: ${REPRESENTATIVE_FRAME_WIDTH:-640}
      REPRESENTATIVE_FRAME_FORMAT: ${REPRESENTATIVE_FRAME_FORMAT:-jpeg}
      REPRESENTATIVE_FRAME_JPEG_QUALITY: ${REPRESENTATIVE_FRAME_JPEG_QUALITY:-85}
      REPRESENTATIVE_FRAME_DEDUP_TOLERANCE_SECONDS: ${REPRESENTATIVE_FRAME_DEDUP_TOLERANCE_SECONDS:-0.5}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-http://9router:20128}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      MODEL_GATEWAY_CONNECT_TIMEOUT_SECONDS: ${MODEL_GATEWAY_CONNECT_TIMEOUT_SECONDS:-10}
      MODEL_GATEWAY_MAX_ATTEMPTS: ${MODEL_GATEWAY_MAX_ATTEMPTS:-3}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-5}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mxbai-embed-large:latest}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-60}
      EMBEDDING_MAX_ATTEMPTS: ${EMBEDDING_MAX_ATTEMPTS:-3}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      TEMPORAL_TARGET_DURATION_SECONDS: ${TEMPORAL_TARGET_DURATION_SECONDS:-30}
      TEMPORAL_MIN_DURATION_SECONDS: ${TEMPORAL_MIN_DURATION_SECONDS:-15}
      TEMPORAL_MAX_DURATION_SECONDS: ${TEMPORAL_MAX_DURATION_SECONDS:-60}
      CANDIDATE_HIT_LIMIT: ${CANDIDATE_HIT_LIMIT:-30}
      CANDIDATE_MAX_RESULTS: ${CANDIDATE_MAX_RESULTS:-5}
      CANDIDATE_MIN_SEMANTIC_SCORE: ${CANDIDATE_MIN_SEMANTIC_SCORE:-0.25}
      CANDIDATE_MAX_SEGMENT_GAP_SECONDS: ${CANDIDATE_MAX_SEGMENT_GAP_SECONDS:-5}
      CANDIDATE_CONTEXT_BEFORE_SECONDS: ${CANDIDATE_CONTEXT_BEFORE_SECONDS:-15}
      CANDIDATE_CONTEXT_AFTER_SECONDS: ${CANDIDATE_CONTEXT_AFTER_SECONDS:-20}
      CANDIDATE_MAX_DURATION_SECONDS: ${CANDIDATE_MAX_DURATION_SECONDS:-120}
      ALIGNMENT_MODEL: ${ALIGNMENT_MODEL:-neovids-vision}
      ALIGNMENT_TIMEOUT_SECONDS: ${ALIGNMENT_TIMEOUT_SECONDS:-120}
      ALIGNMENT_FRAME_INTERVAL_SECONDS: ${ALIGNMENT_FRAME_INTERVAL_SECONDS:-2}
      ALIGNMENT_MAX_FRAMES: ${ALIGNMENT_MAX_FRAMES:-60}
      ALIGNMENT_FRAME_WIDTH: ${ALIGNMENT_FRAME_WIDTH:-640}
      ALIGNMENT_JPEG_QUALITY: ${ALIGNMENT_JPEG_QUALITY:-82}
      ALIGNMENT_FRAME_DEDUP_TOLERANCE_SECONDS: ${ALIGNMENT_FRAME_DEDUP_TOLERANCE_SECONDS:-0.25}
      ALIGNMENT_MAX_TRANSCRIPT_CHARACTERS: ${ALIGNMENT_MAX_TRANSCRIPT_CHARACTERS:-12000}
      ALIGNMENT_REFINEMENT_ENABLED: ${ALIGNMENT_REFINEMENT_ENABLED:-false}
      ALIGNMENT_REFINEMENT_FRAME_INTERVAL_SECONDS: ${ALIGNMENT_REFINEMENT_FRAME_INTERVAL_SECONDS:-0.5}
      ALIGNMENT_REFINEMENT_PADDING_SECONDS: ${ALIGNMENT_REFINEMENT_PADDING_SECONDS:-4}
      ALIGNMENT_REFINEMENT_MAX_FRAMES: ${ALIGNMENT_REFINEMENT_MAX_FRAMES:-40}
      ALIGNMENT_EARLY_STOP_CONFIDENCE: ${ALIGNMENT_EARLY_STOP_CONFIDENCE:-0.90}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["${API_PORT:-8012}:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./storage:/data/storage"
      - "media-indexer-model-cache:/data/models"
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      neovids:
        aliases:
          - media-indexer
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  media-indexer-db-data:
  media-indexer-model-cache:

networks:
  neovids:
    external: true
    name: neovids
